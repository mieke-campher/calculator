<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="calc-body">
        <section class="calc-screen">
            <span class="screen-placeholder">00000000</span>
            <p class="text">0</p>
            <div class="screen-overlay"></div>
        </section>
        
        <section class="calc-buttons">

            <button class="calc-button escape">C</button>
            <button class="calc-button plusminus">+/-</button>
            <button class="calc-button divide">÷</button>
            <button class="calc-button multiply">×</button>

            <button class="calc-button">7</button>
            <button class="calc-button">8</button>
            <button class="calc-button">9</button>
            <button class="calc-button minus">-</button>

            <button class="calc-button">4</button>
            <button class="calc-button">5</button>
            <button class="calc-button">6</button>
            <button class="calc-button add">+</button>

            <button class="calc-button">1</button>
            <button class="calc-button">2</button>
            <button class="calc-button">3</button>
            <button class="calc-button tall-button equal">=</button>

            <button class="calc-button span-two">0</button>
            <button class="calc-button point">.</button>    

        </section>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
